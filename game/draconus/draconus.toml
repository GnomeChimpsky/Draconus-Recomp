# Draconus: Cult of the Wyrm (USA), F888 / T-402 / T40203N / V1.000 / 2000-05-19.
# Values measured from the owner's own dump; see docs/01-DISC-FORENSICS.md.
# The boot program is sha256 86fc4486b066518adf6aada38236177b8bd2ed2566b0c1b6f2e2c7f532574ad8.

[game]
id = "draconus"
title = "Draconus: Cult of the Wyrm"
region = "USA"
product = "F888"

[disc]
image = "CHANGE-ME: path to your own .gdi (or .chd) dump"
sha1_1st_read = "936ef49f675029a512edddd3baece16a2e85c4e4"

[binary]
path = "extracted/fs/1ST_READ.BIN"       # written by dracdisc extract (or dcdisc extract)
load_address = 0x8C010000                # where the BIOS loads the file
link_address = 0x0C010000                # P0 alias of the same RAM, what literal pools assume
entry = 0x8C010000

[functions]
# Discovery on this binary (2026-11-11): pointer tables are not optional. With `pointers = false`
# discovery followed calls from the entry point and found 3,285 functions; this title reaches most
# of its code through tables, so the rest ran in the development interpreter -- 0.15x on the title
# screen, about 0.6x in menus, and slower in gameplay. With `pointers = true` it finds 8,940
# functions (995,051 instructions, about 100 MB of generated C++) and the same scenes run at
# 3.7-3.9x headless and 1.0x in a window. The build takes about five minutes.
#
# `sweep` stays off: it does not terminate on this title (docs/11-M2-RESULTS.md). `extra` seeds are
# not needed with pointer tables on -- the hotspots seeded by hand on 2026-11-11 (an empty function
# called ~98,000 times a frame, then the menu cluster) are all found by the table pass.
pointers = true
sweep = false
extra = []
# Workarounds (2026-11-12): two functions the translated path faults in. Interpreting them removes
# the two reproductions found so far -- 500 frames of d-pad menu navigation and a 20,000-frame
# gameplay run are clean with both, and the windowed parity check is unchanged.
#
#   0x0C16CDF4  a 4,914-byte FP function; without it the translated path faults at pc 0 about 79 s
#               into the menu scene.
#   0x0C0C7F7C  a small function reached from the exception handler; without it a burst of d-pad
#               presses on the main menu faults at frame 192.
#
# The fault signature is the same in both, and in a third crash that is still open: an `rte` outside
# an exception frame (the guest's own task return) resumes at a function entry, and the guest then
# jumps to 0. That machinery, not the two functions, is the thing to fix; take these exclusions out
# when it is.
exclude = [0x0C16CDF4, 0x0C0C7F7C]

[[relocations]]
# Detected by --suggest-config: the game copies 56 bytes from the image to the
# general-exception vector at VBR+0x600 (VBR = 0x8C000000) and runs it there.
source = 0x0C233614
size = 0x38
dest = 0x8C000600
entries = [0x8C000600]

[hle]
# guest address = "runtime handler"; filled in as the Katana calls are reached.

[hooks]
# guest address = "hook name"; later milestones.
